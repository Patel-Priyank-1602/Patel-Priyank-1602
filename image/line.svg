<svg width="100%" height="20" viewBox="0 0 1000 20" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="leftGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0" />
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0.85" />
    </linearGradient>
    <linearGradient id="rightGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#818CF8" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#818CF8" stop-opacity="0" />
    </linearGradient>
    <radialGradient id="centerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="1" />
      <stop offset="100%" stop-color="#818CF8" stop-opacity="0" />
    </radialGradient>
  </defs>
  <!-- Left Line -->
  <line x1="60" y1="10" x2="465" y2="10" stroke="url(#leftGrad)" stroke-width="2" stroke-linecap="round"/>
  
  <!-- Center Decorative Diamond & Dots -->
  <circle cx="475" cy="10" r="2" fill="#38BDF8" fill-opacity="0.7"/>
  <polygon points="500,3 507,10 500,17 493,10" fill="#38BDF8" />
  <circle cx="500" cy="10" r="2" fill="#FFFFFF"/>
  <circle cx="525" cy="10" r="2" fill="#818CF8" fill-opacity="0.7"/>
  
  <!-- Right Line -->
  <line x1="535" y1="10" x2="940" y2="10" stroke="url(#rightGrad)" stroke-width="2" stroke-linecap="round"/>
</svg>
